name: SoundRunner

options:
  bundleIdPrefix: com.example

configs:
  Debug: debug
  Release: release

targets:
  SoundRunner:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AudioAnalyser
    dependencies:
      - framework: Frameworks/Shared.xcframework
        embed: false
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.audioanalyser.ios
        PRODUCT_NAME: SoundRunner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SoundRunner
        INFOPLIST_KEY_NSMicrophoneUsageDescription: SoundRunner uses the microphone to analyze room audio.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
