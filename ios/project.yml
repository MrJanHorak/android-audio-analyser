name: AudioAnalyser

options:
  bundleIdPrefix: com.example

configs:
  Debug: debug
  Release: release

targets:
  AudioAnalyser:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AudioAnalyser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.audioanalyser.ios
        PRODUCT_NAME: AudioAnalyser
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AudioAnalyser
        INFOPLIST_KEY_NSMicrophoneUsageDescription: AudioAnalyser uses the microphone to analyze room audio.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
